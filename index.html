<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Quiz Master</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="quiz-container">

    <!-- Start Screen -->
    <div id="start-screen">
      <h1>Interactive Quiz Master</h1>
      <p>Test your knowledge and see your score at the end.</p>
      <button id="start-btn">Start Quiz</button>
    </div>

    <!-- Quiz Screen -->
    <div id="quiz-screen" class="hide">
      <h2 id="question">Question will appear here</h2>

      <div id="options">
        <!-- Options will come from JavaScript -->
      </div>

      <p id="progress">Question 1 of 5</p>
    </div>

    <!-- Result Screen -->
    <div id="result-screen" class="hide">
      <h2>Quiz Completed!</h2>
      <p id="score-text">Your score will appear here</p>
      <button id="restart-btn">Restart Quiz</button>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
